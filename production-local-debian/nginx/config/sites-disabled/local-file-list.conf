# List the files downloaded by qbittorrent in /qb 
server {
    listen      3904;
    listen      [::]:3904;
    root        /public/;

    location / {
        autoindex on;       # Enable directory listing
        autoindex_exact_size off;  # Show human-readable file sizes
        autoindex_localtime on;    # Display local time for file timestamps
    }
}
