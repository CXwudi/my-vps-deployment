services:
  app:
    ports:
      - "${LOBECHAT_HOST_PORT:-3210}:3210"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3210}
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-http://localhost:${AGENT_GATEWAY_HOST_PORT:-8787}}

  gateway:
    ports:
      - "${AGENT_GATEWAY_HOST_PORT:-8787}:8787"
      - "${DEVICE_GATEWAY_HOST_PORT:-8788}:8788"

  search:
    ports:
      - "${SEARXNG_HOST_PORT:-8080}:8080"
