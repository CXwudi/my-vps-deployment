services:
  app:
    environment:
      APP_URL: ${APP_URL:-https://lobechat.mikufancx.cyou}
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-${APP_URL:-https://lobechat.mikufancx.cyou}/agent-gateway}
    networks:
      - nginx

  gateway:
    networks:
      - nginx

networks:
  nginx:
    name: ${HTTP_GLOBAL_NETWORK:-http-global-network}
    external: true
