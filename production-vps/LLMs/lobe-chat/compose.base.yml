x-shared-env: &shared-env
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

services:
  app:
    image: lobehub/lobehub:latest
    container_name: lobechat-app
    restart: unless-stopped
    env_file:
      - ${LLM_KEYS_ENV_FILE:-../all-llm-keys.env}
    environment:
      <<: *shared-env
      # App
      ACCESS_CODE: ${ACCESS_CODE:-}
      NEXT_PUBLIC_SERVICE_MODE: ${NEXT_PUBLIC_SERVICE_MODE:-server}
      KEY_VAULTS_SECRET: ${KEY_VAULTS_SECRET:?KEY_VAULTS_SECRET must be set in .env}
      # Auth
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      AUTH_SSO_PROVIDERS: ${AUTH_SSO_PROVIDERS:-auth0}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_AUTH0_ID: ${AUTH_AUTH0_ID:-}
      AUTH_AUTH0_SECRET: ${AUTH_AUTH0_SECRET:-}
      AUTH_AUTH0_ISSUER: ${AUTH_AUTH0_ISSUER:-}
      AUTH_CLOUDFLARE_ZERO_TRUST_ID: ${AUTH_CLOUDFLARE_ZERO_TRUST_ID:-}
      AUTH_CLOUDFLARE_ZERO_TRUST_SECRET: ${AUTH_CLOUDFLARE_ZERO_TRUST_SECRET:-}
      AUTH_CLOUDFLARE_ZERO_TRUST_ISSUER: ${AUTH_CLOUDFLARE_ZERO_TRUST_ISSUER:-}
      # Database
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DATABASE_DRIVER: ${DATABASE_DRIVER:-node}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://lobechat-redis:6379}
      REDIS_PREFIX: ${REDIS_PREFIX:-lobechat}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      # Langfuse
      ENABLE_LANGFUSE: ${ENABLE_LANGFUSE:-false}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      # Search and crawl
      SEARCH_PROVIDERS: ${SEARCH_PROVIDERS:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://lobechat-search:8080}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      CRAWLER_IMPLS: ${CRAWLER_IMPLS:-}
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-}
      BROWSERLESS_STEALTH_MODE: ${BROWSERLESS_STEALTH_MODE:-}
      BROWSERLESS_BLOCK_ADS: ${BROWSERLESS_BLOCK_ADS:-}
      # Storage
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-}
      S3_REGION: ${S3_REGION:-}
      # Providers
      ANTHROPIC_BETA_HEADERS: ${ANTHROPIC_BETA_HEADERS:-}
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      search:
        condition: service_healthy

  db:
    image: paradedb/paradedb:latest-pg17
    container_name: lobechat-db
    restart: unless-stopped
    # ParadeDB must preload pg_search for the current LobeChat database schema.
    command: postgres -c shared_preload_libraries=pg_search
    environment:
      <<: *shared-env
    volumes:
      - lobechat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - default
    labels:
      - docker-volume-backup.stop-during-backup=lobechat-db

  redis:
    image: redis:alpine
    container_name: lobechat-redis
    restart: unless-stopped
    # Append-only persistence protects chat cache state across container restarts.
    command: redis-server --appendonly yes
    environment:
      <<: *shared-env
    volumes:
      - lobechat-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - default
    labels:
      - docker-volume-backup.stop-during-backup=lobechat-redis

  search:
    image: searxng/searxng:latest
    container_name: lobechat-search
    restart: unless-stopped
    volumes:
      - searxng-data:/etc/searxng
    environment:
      SEARXNG_BIND_ADDRESS: ${SEARXNG_BIND_ADDRESS:-0.0.0.0}
      SEARXNG_PORT: ${SEARXNG_PORT:-8080}
      SEARXNG_LIMITER: ${SEARXNG_LIMITER:-false}
      INSTANCE_NAME: ${SEARXNG_INSTANCE_NAME:-LobeChat SearXNG}
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

networks:
  default:
    name: lobechat-defnet

volumes:
  lobechat-db:
    name: lobechat-db
  lobechat-redis:
    name: lobechat-redis
  searxng-data:
    name: lobechat-searxng-data
