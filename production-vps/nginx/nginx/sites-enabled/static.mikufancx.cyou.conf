server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         static.mikufancx.cyou;

    # SSL
    ssl_certificate     /etc/ssl/_.mikufancx.cyou.crt;
    ssl_certificate_key /etc/ssl/_.mikufancx.cyou.key;

    # security
    include             nginxconfig.io/security.conf;

    # logging
    access_log          /var/log/nginx/static.mikufancx.cyou.access.log cloudflare buffer=512k flush=1m;
    error_log           /var/log/nginx/static.mikufancx.cyou.error.log warn;

    include             my-patches/file-listing.conf;
    # additional config
    include             nginxconfig.io/general.conf;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name static.mikufancx.cyou;
    return      301 https://static.mikufancx.cyou$request_uri;
}