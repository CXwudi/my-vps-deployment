server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         lobechat.mikufancx.cyou;

    # SSL
    ssl_certificate     /etc/ssl/_.mikufancx.cyou.crt;
    ssl_certificate_key /etc/ssl/_.mikufancx.cyou.key;

    # security
    include             nginxconfig.io/security.conf;
    include             nginxconfig.io/no-cache.conf;

    # logging
    access_log          /var/log/nginx/lobechat.mikufancx.cyou.access.log cloudflare buffer=512k flush=1m;
    error_log           /var/log/nginx/lobechat.mikufancx.cyou.error.log warn;

    # Resolve Docker names at request time after container replacements.
    resolver 127.0.0.11 valid=15s;

    # Variable proxy_pass URLs need an explicit prefix rewrite, without a URI.
    location ^~ /agent-gateway/ {
        set                   $agent_backend "http://lobechat-gateway:8787";
        rewrite               ^/agent-gateway/(.*)$ /$1 break;
        proxy_pass            $agent_backend;
        proxy_set_header Host $host;
        include               nginxconfig.io/proxy/stream_proxy.conf;
    }

    location ^~ /device-gateway/ {
        set                   $device_backend "http://lobechat-gateway:8788";
        rewrite               ^/device-gateway/(.*)$ /$1 break;
        proxy_pass            $device_backend;
        proxy_set_header Host $host;
        include               nginxconfig.io/proxy/stream_proxy.conf;
    }

    # reverse proxy
    location / {
        set                   $backend "http://lobechat-app:3210";
        proxy_pass            $backend;
        proxy_set_header Host $host;
        include               nginxconfig.io/proxy/stream_proxy.conf;
    }

    # additional config
    include nginxconfig.io/general.conf;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name lobechat.mikufancx.cyou;
    return      301 https://lobechat.mikufancx.cyou$request_uri;
}
