services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    container_name: nginx
    volumes:
      # Mount individual config roots so generated nginx files do not delete patches.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/my-patches:/etc/nginx/my-patches:ro
      - ./nginx/nginxconfig.io:/etc/nginx/nginxconfig.io:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./logs:/var/log/nginx
      - ../certification/letsencrypt-cert:/etc/ssl:ro
      - ../certification/dhparam.pem:/etc/nginx/dhparam.pem:ro
      # - /dev/xray/socket/:/dev/xray/socket/
      - ../public-files/:/public/files/:ro
    ports:
      - "80:80/tcp"
      - "80:80/udp"
      - "443:443/tcp"
      - "443:443/udp"
    extra_hosts:
      # Allow nginx to proxy host-bound services when needed.
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-America/New_York}
    networks:
      - default
      - nginx

networks:
  default:
    name: nginx-defnet
  nginx:
    name: ${HTTP_GLOBAL_NETWORK:-http-global-network}
    external: true
