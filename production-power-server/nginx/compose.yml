services:
  nginx:
    image: nginx
    restart: unless-stopped
    container_name: nginx
    volumes:
      # copy configs without deleting other files internal
      # files in /etc/nginx
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      # folders in /etc/nginx
      - ./config/nginxconfig.io:/etc/nginx/nginxconfig.io:ro
      - ./config/sites-enabled:/etc/nginx/sites-enabled
      - ./config/htpasswd:/etc/nginx/htpasswd:ro
      # templates for environment-aware configs
      - ./templates:/etc/nginx/templates:ro
      # export logs
      - ./logs:/var/log/nginx
      # external files
      # certification
      - ./certificate/letsencrypt-cert:/etc/ssl:ro
      - ./certificate/dhparam.pem:/etc/nginx/dhparam.pem:ro
    ports:
      - "80:80/tcp"
      - "80:80/udp"
      - "443:443/tcp"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway" # allow to access services on host
    environment:
      # General settings
      - TZ=America/New_York # set the correct timezone for better debugging
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/sites-enabled # output dir for envsubst, preserve NGINXConfig.io structure
      # Domain configuration
      - BASE_DOMAIN=${BASE_DOMAIN}
      # Dify service
      - DIFY_SUBDOMAIN=${DIFY_SUBDOMAIN}
      - DIFY_BACKEND=${DIFY_BACKEND:-http://dify-nginx}
      # N8N service
      - N8N_SUBDOMAIN=${N8N_SUBDOMAIN}
      - N8N_BACKEND=${N8N_BACKEND:-http://n8n-main:5678}
    networks:
      - default
      - global-net

networks:
  default:
    name: nginx-defnet
  global-net:
    name: global-net
    external: true