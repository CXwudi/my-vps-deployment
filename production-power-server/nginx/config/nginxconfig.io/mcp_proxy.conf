# MCP proxy settings tailored for SSE and streaming-friendly MCP endpoints.
# Use this include instead of nginxconfig.io/proxy.conf on any `/mcp/` routes.

# Protocol compatibility
proxy_http_version          1.1;
proxy_ssl_server_name       on;

# Forwarded headers
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Forwarded         $proxy_add_forwarded;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Connection handling and streaming controls
proxy_set_header Upgrade           "";
proxy_set_header Connection        "";
proxy_set_header X-Accel-Buffering off;
proxy_buffering             off;
proxy_request_buffering     off;
proxy_cache                 off;
gzip                        off;
chunked_transfer_encoding   off;

# Timeouts for long-lived server-sent events
proxy_connect_timeout       3600s;
proxy_send_timeout          3600s;
proxy_read_timeout          3600s;
