# Streaming reverse proxy settings for WebSocket, SSE, and streamable HTTP.
include nginxconfig.io/proxy/proxy_common.conf;

# Streaming controls for SSE and streamable HTTP
proxy_buffering                    off;
proxy_request_buffering            off;
proxy_cache                        off;
gzip                               off;

# Proxy timeouts for long-lived WebSocket/SSE streams
proxy_connect_timeout              3600s;
proxy_send_timeout                 3600s;
proxy_read_timeout                 3600s;
send_timeout                       3600s;
