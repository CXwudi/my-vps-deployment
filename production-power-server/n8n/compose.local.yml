services:
  n8n-main:
    environment:
      # Local development URLs and protocol
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678
      N8N_SECURE_COOKIE: false
    ports:
      - "5678:5678"

  n8n-worker:
    environment:
      # Local development URLs and protocol
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678
